name: Hello

#runs on a trigger
# on: 
#   push:
#       branches: main

on: 
  workflow_dispatch: 

jobs:
  greet:
      runs-on: ubuntu-latest
      steps:
        - name: Say hello to user
          run: echo "hello dosto"
        - name: Say hello to username
          run: echo "hello $USER"

  details:
      runs-on: ubuntu-latest
      steps:
        - name: version of docker and python
          run: docker --version && python --version
